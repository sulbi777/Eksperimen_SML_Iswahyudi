name: preprocess-bank-marketing
on:
  workflow_dispatch:
  push:
    paths:
      - "download_raw_data.py"
      - "preprocessing/**"
      - "requirements.txt"
      - ".github/workflows/preprocess.yml"
jobs:
  preprocess:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python download_raw_data.py
      - run: python preprocessing/automate_Iswahyudi.py
      - uses: actions/upload-artifact@v4
        with: {name: bank-marketing-preprocessed, path: namadataset_preprocessing/}
      - name: Commit refreshed processed dataset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add namadataset_preprocessing
          git diff --cached --quiet || git commit -m "chore: refresh preprocessed dataset"
          git push
