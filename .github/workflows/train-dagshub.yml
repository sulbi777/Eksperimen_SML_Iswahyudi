name: train-and-track-dagshub

on:
  workflow_dispatch:
    inputs:
      n_iter:
        description: "Jumlah konfigurasi hyperparameter yang diuji"
        required: true
        default: "12"

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
      DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
      DAGSHUB_API_TOKEN: ${{ secrets.DAGSHUB_API_TOKEN }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_API_TOKEN }}
      MLFLOW_TRACKING_URI: "https://dagshub.com/${{ secrets.DAGSHUB_USER }}/${{ secrets.DAGSHUB_REPO }}.mlflow"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download raw data
        run: python download_raw_data.py

      - name: Preprocessing
        run: python preprocessing/automate_Iswahyudi.py

      - name: Tune model and log to DagsHub
        run: python Membangun_model/modelling_tuning.py --n-iter ${{ inputs.n_iter }}

      - name: Ensure artifacts directory exists
        run: mkdir -p Membangun_model/artifacts/

      - name: Upload training evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-evidence
          path: Membangun_model/artifacts/
